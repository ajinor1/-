<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎲 対照実験 - 乱数生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Arial', sans-serif;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .dice {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            user-select: none;
        }
        .dice.rolling {
            transform: scale(0.8);
            opacity: 0.5;
        }
        .dice.match {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .result.lose {
            color: #ff6b6b;
        }
        .result.win {
            color: #ffd700;
            animation: celebrate 0.5s ease infinite alternate;
        }
        @keyframes celebrate {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        .history {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            max-height: 80px;
            overflow-y: auto;
        }
        .history span {
            display: inline-block;
            margin: 2px 4px;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .history .win-text {
            color: #ffd700;
        }
        .history .lose-text {
            color: #ff6b6b;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 対照実験</h1>
        <p class="subtitle">外部通信ゼロ！Firebase不使用</p>

        <div class="dice-container">
            <div class="dice" id="dice1">⚀</div>
            <div class="dice" id="dice2">⚀</div>
            <div class="dice" id="dice3">⚀</div>
        </div>

        <button class="btn" id="rollBtn">🎯 振る！</button>

        <div class="result" id="result">👆 ボタンを押してね</div>
        <div id="status">✅ 準備完了（外部通信なし）</div>
        <div class="history" id="history"></div>
    </div>

    <div class="confetti" id="confetti"></div>

    <!-- main.js を読み込み -->
    <script type="module" src="./main.js"></script>
</body>
</html>
